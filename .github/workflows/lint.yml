name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax & style (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Style and syntax run on the lowest supported PHP version by design;
      # the 8.2 - 8.5 matrix is covered by tests.yml. php -l is repeated there
      # across the matrix, so "valid on every version we support" is actually
      # checked, not just asserted here.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Providers/ references App\* and Illuminate\* classes that exist only
      # inside a booted FreeScout install, so it can never be autoloaded here.
      # php -l checks it is valid PHP without loading anything.
      - name: Lint PHP syntax (php -l)
        run: |
          set -e
          git ls-files -- '*.php' | while read -r file; do
            php -l "$file"
          done

      # Ruleset lives in phpcs.xml (PSR-12, with a documented, narrow
      # exclusion for PHPUnit's snake_case test method convention).
      # -n suppresses warnings (e.g. the soft line-length limit) from failing
      # the build; only real PSR-12 errors fail this job.
      - name: PHP_CodeSniffer (PSR-12)
        run: vendor/bin/phpcs -n

      # Without --no-check-lock, this also catches composer.json/lock drift.
      - name: Validate composer.json
        run: composer validate --strict
