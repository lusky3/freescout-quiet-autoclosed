name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 8.2 is FreeScout's own recommended minimum (its installation guide
        # explicitly warns against 8.1). 8.5 is included because that is what
        # current FreeScout container images actually ship, so it is the
        # version this module really runs on in production.
        php-version: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # The module ships as plain files copied into a FreeScout install, so
      # "is this valid on the PHP the customer actually runs" is a real
      # question the unit suite alone does not answer.
      - name: Lint PHP syntax (php -l)
        run: |
          set -e
          git ls-files -- '*.php' | while read -r file; do
            php -l "$file"
          done

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit
