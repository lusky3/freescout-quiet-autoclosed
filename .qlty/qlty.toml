config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  # This project keeps its suite in Tests/, which none of the defaults below
  # match - without this, test code is graded as production code.
  "Tests/**",
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "editorconfig-checker"
mode = "comment"

[[plugin]]
name = "osv-scanner"

# php-codesniffer is deliberately not enabled here. It is already run by CI
# and by `composer lint`, at 4.0.4 and against this project's own phpcs.xml
# ruleset - whereas qlty pins 3.10.3, which Composer now refuses to install
# because of a security advisory (PKSA-rdkp-vv9z-mjkg). One phpcs, current,
# with the project's ruleset, beats two.

[[plugin]]
name = "radarlint-php"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# --- Deliberate exceptions -------------------------------------------------
#
# Each of these is a rule that is right in general and wrong for the specific
# code it fires on here. They are listed individually, scoped to the narrowest
# path that covers them, rather than muted tool-wide.

# radarlint applies production rules that are wrong for test code here, and
# qlty's exclusions are plugin-scoped rather than rule-scoped, so this is all
# or nothing for Tests/. All-or-nothing is fine in this direction:
#
#   - Tests/Stubs are doubles for FreeScout and Laravel. They reproduce those
#     signatures exactly, so their unused parameters are the contract rather
#     than an oversight, and a generic exception is the right thing for a
#     double to throw when a test deliberately provokes it (S1172, S112).
#   - A test class with more than 20 methods covers more than 20 cases.
#     Splitting it to satisfy a counter would make the suite worse (S1448).
#
# Nothing is suppressed for the shipped code in Providers/ and Services/ -
# those are clean on the full ruleset.
[[exclude]]
plugins = ["radarlint-php"]
file_patterns = ["Tests/**"]
