# SonarQube Cloud (sonarcloud.io), organization "lusk".
sonar.projectKey=lusky3_freescout-quiet-autoclosed
sonar.organization=lusk
sonar.projectName=Quiet Auto-Closed

# The shipped module. Tests are declared separately so Sonar rates them as
# test code rather than counting them against the production ruleset - the
# same distinction .codacy.yml makes, for the same reason.
sonar.sources=Providers,Services
sonar.tests=Tests

# Deliberate framework doubles. They mirror FreeScout's and Laravel's
# signatures exactly, which means unused parameters and multiple classes per
# file are the point rather than a defect.
sonar.test.exclusions=Tests/Stubs/**

sonar.php.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
